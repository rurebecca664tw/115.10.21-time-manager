<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f0">
  <title>教室時間管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@200..900&family=Zen+Maru+Gothic:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    /* 投影畫面採高對比淺底色，時鐘使用等寬字型以保持穩定寬度。 */
    :root {
      color-scheme: light;
      --canvas: #f3f6f1;
      --paper: var(--canvas);
      --ink: #172b2a;
      --muted: #53615b;
      --line: #c7cec8;
      --green: #176b58;
      --green-soft: #e1eee8;
      --red: #b42318;
      --white: #ffffff;
      font-family: "Chiron GoRound TC", sans-serif;
      font-weight: 300;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    html, body {
      min-width: 320px;
      min-height: 100%;
      margin: 0;
    }

    body {
      color: var(--ink);
      background-color: var(--canvas);
      background-image: radial-gradient(#dfe8df 0.8px, transparent 0.8px);
      background-size: 18px 18px;
    }

    button, input, textarea { font: inherit; }

    .page {
      width: min(1160px, calc(100% - 48px));
      min-height: 100vh;
      margin-inline: auto;
      padding: 26px 0 38px;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    .fullscreen-button {
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--ink);
      border-radius: 4px;
      color: var(--ink);
      background: var(--paper);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .fullscreen-button:hover { color: var(--white); background: var(--ink); }
    .fullscreen-button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid #d4a64a;
      outline-offset: 3px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
    }

    .volume-control {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .volume-control input {
      width: 104px;
      margin: 0;
      accent-color: var(--green);
      cursor: pointer;
    }

    .volume-control output {
      min-width: 3em;
      color: var(--ink);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .tab-nav {
      margin: 24px 0 4px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 8px;
    }

    .tab-button {
      min-height: 48px;
      padding: 0 18px;
      border: 0;
      border-bottom: 3px solid transparent;
      color: var(--muted);
      background: transparent;
      font-weight: 700;
      cursor: pointer;
    }

    .tab-button[aria-selected="true"] {
      border-bottom-color: var(--green);
      color: var(--ink);
    }

    .tab-button:focus-visible, .action-button:focus-visible, .delete-button:focus-visible,
    .school-ring-button:focus-visible, .pomo-button:focus-visible {
      outline: 3px solid #d4a64a;
      outline-offset: 3px;
    }

    .tab-panel { flex: 1; }
    .tab-panel[hidden] { display: none; }

    .feature-panel {
      width: min(920px, 100%);
      margin: 0 auto;
      padding: clamp(32px, 7vh, 72px) 0;
    }

    .feature-heading {
      margin: 0 0 8px;
      font-size: clamp(24px, 3.5vw, 34px);
    }

    .feature-description { margin: 0 0 28px; color: var(--muted); }

    .ring-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .school-ring-button {
      min-height: 150px;
      border: 0;
      border-radius: 4px;
      color: var(--white);
      background: var(--green);
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 800;
      cursor: pointer;
    }

    .school-ring-button:hover { filter: brightness(0.92); }
    .school-ring-button.end-bell { color: var(--ink); background: #e5bd63; }

    .schedule-settings {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    .schedule-header {
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .schedule-header h3 { margin: 0; font-size: 20px; }

    .toggle-control {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .toggle-control input { width: 22px; height: 22px; accent-color: var(--green); }

    .schedule-form {
      display: grid;
      grid-template-columns: minmax(150px, 1.3fr) 1fr 1fr auto;
      align-items: end;
      gap: 12px;
    }

    .schedule-form select, .schedule-form input {
      width: 100%;
      min-height: 48px;
      padding: 10px;
      border: 1px solid #aeb8b1;
      border-radius: 3px;
      color: var(--ink);
      background: var(--white);
      font: inherit;
    }

    .schedule-import-actions {
      margin-top: 12px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .import-help, .import-status { color: var(--muted); font-size: 13px; }
    .import-status { min-height: 20px; margin: 0; }

    .schedule-list { margin: 20px 0 0; padding: 0; list-style: none; }

    .schedule-row {
      min-height: 56px;
      padding: 9px 0;
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: minmax(100px, 1fr) 1fr 1fr auto;
      align-items: center;
      gap: 12px;
    }

    .schedule-period { font-weight: 700; }
    .schedule-times { color: var(--muted); font-variant-numeric: tabular-nums; }

    .pomo-panel { max-width: 1040px; }

    .pomo-layout {
      display: grid;
      grid-template-columns: minmax(220px, 0.85fr) minmax(0, 1.15fr);
      align-items: center;
      gap: clamp(28px, 6vw, 78px);
    }

    .pomo-progress {
      --progress: 100%;
      --ring-color: #c84232;
      position: relative;
      width: clamp(220px, 29vw, 310px);
      aspect-ratio: 1;
      margin-inline: auto;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--ring-color) var(--progress), #eadbd5 0);
      transition: background 0.35s ease;
    }

    .pomo-progress::before {
      position: absolute;
      inset: 13px;
      border: 1px solid #f1e7e1;
      border-radius: 50%;
      background: #fffaf5;
      content: "";
    }

    .pomo-progress[data-mode="break"] { --ring-color: #6f9e69; }

    .tomato-illustration {
      z-index: 1;
      width: clamp(145px, 18vw, 190px);
      aspect-ratio: 1;
      object-fit: cover;
      object-position: center;
      filter: drop-shadow(0 9px 4px rgb(90 48 26 / 14%));
    }

    .pomo-content { min-width: 0; text-align: center; }

    .pomo-mode {
      margin: 0 0 10px;
      color: var(--green);
      font-size: 20px;
      font-weight: 800;
    }

    .pomo-clock {
      margin: 0;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: clamp(82px, 11vw, 142px);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1;
    }

    .pomo-round { margin: 10px 0 20px; color: var(--muted); font-size: 18px; }

    .pomo-focus-total {
      width: fit-content;
      margin: 0 auto 22px;
      padding: 9px 15px;
      border: 1px solid #d7c6b7;
      border-radius: 18px;
      color: #744c3c;
      background: #f4e8dc;
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .pomo-settings {
      margin: 0 auto 24px;
      display: flex;
      justify-content: center;
      gap: 18px;
    }

    .pomo-setting { display: flex; align-items: center; gap: 8px; color: var(--muted); }
    .pomo-setting input {
      width: 76px;
      min-height: 42px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 3px;
      color: var(--ink);
      background: var(--white);
      font: inherit;
      text-align: center;
    }

    .pomo-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }

    .pomo-button {
      min-width: 104px;
      min-height: 48px;
      padding: 0 16px;
      border: 1px solid var(--green);
      border-radius: 3px;
      color: var(--white);
      background: var(--green);
      font-weight: 700;
      cursor: pointer;
    }

    .pomo-button.secondary { color: var(--green); background: transparent; }
    .pomo-button.secondary:hover { color: var(--white); background: var(--green); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .clock-panel {
      padding: clamp(30px, 7vh, 76px) 0 clamp(34px, 7vh, 72px);
      text-align: center;
    }

    .date-line {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: clamp(18px, 2.4vw, 25px);
      font-weight: 600;
    }

    .clock {
      margin: 0;
      color: var(--ink);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: clamp(76px, 16.5vw, 190px);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 0.98;
      white-space: nowrap;
    }

    .clock-separator { color: var(--green); }

    .task-display {
      width: min(790px, 100%);
      min-height: 150px;
      margin: 0 auto;
      padding: 22px 26px;
      border-top: 2px solid var(--ink);
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 20px;
    }

    .task-copy { min-width: 0; }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--green);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .task-title {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: clamp(22px, 3.5vw, 34px);
      font-weight: 700;
      line-height: 1.3;
    }

    .task-meta {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    .countdown {
      min-width: 178px;
      padding-left: 20px;
      border-left: 1px solid var(--line);
      text-align: right;
    }

    .countdown-label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .countdown-value {
      display: block;
      color: var(--green);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: clamp(28px, 4vw, 43px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .countdown.is-urgent .countdown-value,
    .countdown.is-urgent .countdown-label { color: var(--red); }

    .countdown.is-ended .countdown-value { color: var(--muted); }

    .notice-ticker {
      width: min(1000px, 100%);
      min-height: 58px;
      margin: 20px auto 0;
      overflow: hidden;
      border: 1px solid #176b58;
      border-radius: 4px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: stretch;
      color: #ffffff;
      background: #174d40;
    }

    .notice-label {
      padding: 0 18px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background: #e5bd63;
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
    }

    .notice-window { min-width: 0; overflow: hidden; display: flex; align-items: center; }

    .notice-track {
      width: max-content;
      display: flex;
      align-items: center;
      animation: notice-scroll var(--notice-duration, 18s) linear infinite;
    }

    .notice-copy {
      flex: 0 0 auto;
      padding-right: 64px;
      color: #ffffff;
      font-size: clamp(16px, 2vw, 21px);
      font-weight: 700;
      white-space: nowrap;
    }

    .notice-track.is-static { width: 100%; justify-content: center; animation: none; }
    .notice-track.is-static .notice-copy { padding-right: 0; white-space: normal; text-align: center; }
    .notice-track.is-static .notice-copy + .notice-copy { display: none; }

    @keyframes notice-scroll {
      to { transform: translateX(-50%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .notice-track { animation: none; }
      .notice-track:not(.is-static) { width: 100%; justify-content: center; }
      .notice-track:not(.is-static) .notice-copy { padding-right: 0; white-space: normal; text-align: center; }
      .notice-track:not(.is-static) .notice-copy + .notice-copy { display: none; }
    }

    .notes-line {
      margin: 15px 0 0;
      color: var(--muted);
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    .editor {
      padding-top: 27px;
      border-top: 1px solid var(--line);
    }

    .editor-heading {
      margin: 0 0 18px;
      font-size: 18px;
      font-weight: 800;
    }

    .form-grid {
      display: grid;
      grid-template-columns: minmax(210px, 1.4fr) minmax(210px, 1fr) minmax(200px, 1fr);
      gap: 16px;
      align-items: end;
    }

    .field { display: grid; gap: 8px; }

    .field > label, .field > .label {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .field input, .field textarea {
      width: 100%;
      min-height: 48px;
      padding: 11px 12px;
      border: 1px solid #aeb8b1;
      border-radius: 3px;
      color: var(--ink);
      background: var(--white);
      font-size: 16px;
    }

    .field textarea {
      min-height: 48px;
      max-height: 120px;
      resize: vertical;
    }

    .time-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .time-field { display: grid; gap: 8px; }

    .time-field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .save-status {
      min-height: 22px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .form-actions {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .action-button {
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--green);
      border-radius: 3px;
      color: var(--white);
      background: var(--green);
      font-weight: 700;
      cursor: pointer;
    }

    .action-button:hover { background: #105542; }

    .secondary-button {
      color: var(--green);
      background: transparent;
    }

    .secondary-button:hover { color: var(--white); }

    .task-list {
      margin: 20px 0 0;
      padding: 0;
      border-top: 1px solid var(--line);
      list-style: none;
    }

    .task-row {
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 16px;
    }

    .task-row-title { overflow-wrap: anywhere; font-weight: 700; }
    .task-row-meta { margin-top: 3px; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .task-row-status { color: var(--green); font-size: 13px; font-weight: 700; }

    .delete-button {
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 3px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .delete-button:hover { color: var(--red); border-color: var(--red); }
    .empty-list { padding: 14px 0; color: var(--muted); font-size: 14px; }

    /* 投影模式只保留時鐘、任務摘要與退出全螢幕的控制鈕。 */
    body.projector .page {
      width: min(1440px, calc(100% - 64px));
      padding-block: 30px;
    }

    body.projector .brand, body.projector .editor, body.projector .save-status { display: none; }
    body.projector .tab-nav { display: none; }
    body.projector main { justify-content: center; }
    body.projector .clock-panel { padding-block: clamp(34px, 8vh, 100px); }
    body.projector .clock { font-size: clamp(90px, 19vw, 250px); }
    body.projector .task-display { width: min(1000px, 100%); }
    body.projector .fullscreen-button { background: transparent; }

    @media (max-width: 760px) {
      .page { width: min(100% - 32px, 560px); padding-top: 16px; }
      .clock-panel { padding-block: 48px 40px; }
      .clock { font-size: clamp(68px, 17vw, 118px); }
      .task-display { grid-template-columns: 1fr; gap: 16px; padding: 20px 4px; }
      .countdown { min-width: 0; padding: 13px 0 0; border-top: 1px solid var(--line); border-left: 0; text-align: left; }
      .form-grid { grid-template-columns: 1fr; gap: 14px; }
      .save-status { text-align: left; }
      .task-row { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; }
      .task-row-status { grid-column: 1; grid-row: 2; }
      .delete-button { grid-column: 2; grid-row: 1 / span 2; }
      .tab-nav { gap: 0; overflow-x: auto; }
      .tab-button { flex: 1 0 auto; padding-inline: 10px; font-size: 14px; }
      .ring-controls { gap: 10px; }
      .school-ring-button { min-height: 112px; }
      .schedule-form { grid-template-columns: 1fr 1fr; }
      .schedule-form .field:first-child { grid-column: 1 / -1; }
      .schedule-row { grid-template-columns: minmax(90px, 1fr) 1fr auto; gap: 8px; }
      .schedule-row .schedule-times.end-time { grid-column: 2; }
      .schedule-row .delete-button { grid-column: 3; grid-row: 1 / span 2; }
      .pomo-settings { flex-wrap: wrap; gap: 10px 18px; }
      .pomo-button { min-width: 88px; }
      .pomo-layout { grid-template-columns: 1fr; gap: 28px; }
      .pomo-progress { width: clamp(190px, 54vw, 250px); }
      .pomo-clock { font-size: clamp(76px, 21vw, 112px); }
      body.projector .page { width: calc(100% - 32px); }
      body.projector .clock { font-size: clamp(68px, 17vw, 128px); }
    }

    @media (max-width: 380px) {
      .clock { font-size: 18vw; }
      .brand { font-size: 12px; }
      .fullscreen-button { padding-inline: 10px; font-size: 13px; }
    }

    @media (max-width: 520px) {
      .topbar { flex-wrap: wrap; gap: 12px; }
      .topbar-actions { width: 100%; justify-content: space-between; }
      .volume-control { flex: 1; max-width: 260px; }
      .volume-control input { flex: 1; width: auto; min-width: 60px; }
    }

    body :not(h1):not(h2):not(h3) {
      font-family: "Chiron GoRound TC", sans-serif;
      font-weight: 300;
    }

    h1, h2, h3, h1[class], h2[class], h3[class] {
      font-family: "Zen Maru Gothic", sans-serif;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand" aria-label="教室時間管理">
        <img class="brand-mark" src="libraries/沙漏.jpg" alt="" aria-hidden="true">
        <span>教室時間管理</span>
      </div>
      <div class="topbar-actions">
        <label class="volume-control" for="soundVolumeInput">
          <span>音量</span>
          <input id="soundVolumeInput" type="range" min="0" max="100" step="1" value="70" aria-label="音量">
          <output id="soundVolumeValue" for="soundVolumeInput">70%</output>
        </label>
        <button class="fullscreen-button" id="fullscreenButton" type="button" aria-pressed="false">進入全螢幕</button>
      </div>
    </header>

    <!-- 以 ARIA tablist 提供三種課堂時間工具的切換入口。 -->
    <nav class="tab-nav" role="tablist" aria-label="時間管理工具">
      <button class="tab-button" id="taskTab" type="button" role="tab" aria-selected="true" aria-controls="taskClockView" data-tab="taskClockView">任務時鐘</button>
      <button class="tab-button" id="schoolTab" type="button" role="tab" aria-selected="false" aria-controls="schoolBellView" data-tab="schoolBellView">上下課鐘</button>
      <button class="tab-button" id="pomoTab" type="button" role="tab" aria-selected="false" aria-controls="pomodoroView" data-tab="pomodoroView">靜心番茄鐘</button>
    </nav>

    <section class="tab-panel is-active" id="taskClockView" role="tabpanel" aria-labelledby="taskTab" tabindex="0">
      <main>
      <section class="clock-panel" aria-label="台灣標準時間">
        <p class="date-line" id="dateLine" aria-live="polite"></p>
        <h1 class="clock" id="clock" aria-label="目前時間">--:--:--</h1>
      </section>

      <section class="task-display" aria-label="目前任務資訊">
        <div class="task-copy">
          <p class="eyebrow" id="taskStatus">目前任務</p>
          <h2 class="task-title" id="taskTitle">尚未設定任務</h2>

  <script>
    // 使用台北時區的標準函式庫格式化日期與時間，不依賴裝置目前設定的時區。
    const taipeiDateFormatter = new Intl.DateTimeFormat("zh-TW", {
      timeZone: "Asia/Taipei",
      year: "numeric",
      month: "long",
      day: "numeric",
      weekday: "long"
    });
    const taipeiTimeFormatter = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Asia/Taipei",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hourCycle: "h23"
    });

    // 集中取得頁面節點，後續只更新時鐘和任務摘要中需要變動的內容。
    const elements = {
      clock: document.querySelector("#clock"),
      dateLine: document.querySelector("#dateLine"),
      taskTitle: document.querySelector("#taskTitle"),
      taskStatus: document.querySelector("#taskStatus"),
      taskTime: document.querySelector("#taskTime"),
      notesLine: document.querySelector("#notesLine"),
      countdown: document.querySelector("#countdown"),
      countdownLabel: document.querySelector("#countdownLabel"),
      countdownValue: document.querySelector("#countdownValue"),
      taskForm: document.querySelector("#taskForm"),
      taskInput: document.querySelector("#taskInput"),
      startInput: document.querySelector("#startInput"),
      endInput: document.querySelector("#endInput"),
      notesInput: document.querySelector("#notesInput"),
      saveStatus: document.querySelector("#saveStatus"),
      taskList: document.querySelector("#taskList"),
      noticeInput: document.querySelector("#noticeInput"),
      noticeWindow: document.querySelector("#noticeWindow"),
      noticeTrack: document.querySelector("#noticeTrack"),
      noticeText: document.querySelector("#noticeText"),
      noticeTextDuplicate: document.querySelector("#noticeTextDuplicate"),
      soundTestButton: document.querySelector("#soundTestButton"),
      soundVolumeInput: document.querySelector("#soundVolumeInput"),
      soundVolumeValue: document.querySelector("#soundVolumeValue"),
      fullscreenButton: document.querySelector("#fullscreenButton"),
      tabButtons: [...document.querySelectorAll("[role='tab']")],
      tabPanels: [...document.querySelectorAll("[role='tabpanel']")],
      classBellButton: document.querySelector("#classBellButton"),
      dismissalBellButton: document.querySelector("#dismissalBellButton"),
      scheduleForm: document.querySelector("#scheduleForm"),
      periodInput: document.querySelector("#periodInput"),
      periodStartInput: document.querySelector("#periodStartInput"),
      periodEndInput: document.querySelector("#periodEndInput"),
      importScheduleButton: document.querySelector("#importScheduleButton"),
      scheduleFileInput: document.querySelector("#scheduleFileInput"),
      scheduleImportStatus: document.querySelector("#scheduleImportStatus"),
      autoBellToggle: document.querySelector("#autoBellToggle"),
      scheduleList: document.querySelector("#scheduleList"),
      pomodoroMode: document.querySelector("#pomodoroMode"),
      pomodoroProgress: document.querySelector("#pomodoroProgress"),
      pomodoroClock: document.querySelector("#pomodoroClock"),
      pomodoroRound: document.querySelector("#pomodoroRound"),
      pomodoroFocusTotal: document.querySelector("#pomodoroFocusTotal"),
      focusMinutesInput: document.querySelector("#focusMinutesInput"),
      breakMinutesInput: document.querySelector("#breakMinutesInput"),
      pomodoroStartButton: document.querySelector("#pomodoroStartButton"),
      pomodoroPauseButton: document.querySelector("#pomodoroPauseButton"),
      pomodoroResetButton: document.querySelector("#pomodoroResetButton"),
      pomodoroSkipButton: document.querySelector("#pomodoroSkipButton")
    };
    const storageKey = "classroom-time-manager-v1";
    const noticeStorageKey = "classroom-notice-v1";
    const defaultNotice = "請留意老師公告與課堂指示。";
    const scheduleStorageKey = "classroom-bell-schedule-v1";
    const pomodoroStorageKey = "classroom-pomodoro-settings-v1";
    const focusTotalStorageKey = "classroom-focus-total-seconds-v1";
    const soundVolumeStorageKey = "classroom-sound-volume-v1";
    const periodOrder = ["早自習", "第一節", "第二節", "第三節", "第四節", "午休", "第五節", "第六節", "第七節"];
    let tasks = [];
    let scheduleEntries = [];
    let autoBellEnabled = false;
    const timerSound = new Audio("libraries/計時器.mp3");
    const classBellSound = new Audio("libraries/上課鐘聲.mp3");
    const dismissalBellSound = new Audio("libraries/下課鐘聲.mp3");
    const breakMusic = new Audio("libraries/Harmony-of-the-Earth-chosic.com_.mp3");
    const activeAudioPlaybacks = new Set();
    breakMusic.loop = true;
    let breakMusicPlaybackBlocked = false;
    let previousClockUpdate = Date.now();
    let previousScheduleCheck = Date.now();
    let renderedTaskListState = null;
    let pomodoroSettings = { focusMinutes: 15, breakMinutes: 5 };
    let pomodoroMode = "focus";
    let pomodoroRound = 1;
    let pomodoroRemainingSeconds = 15 * 60;
    let pomodoroRunning = false;
    let pomodoroEndAt = 0;
    let pomodoroLastTickAt = 0;
    let focusTotalSeconds = 0;
    let savedFocusTotalMinutes = -1;

    // 切換分頁時只顯示選取的面板，並同步鍵盤輔助狀態。
    function selectTab(panelId) {
      for (const button of elements.tabButtons) {
        const isSelected = button.dataset.tab === panelId;
        button.setAttribute("aria-selected", String(isSelected));
        button.tabIndex = isSelected ? 0 : -1;
      }
      for (const panel of elements.tabPanels) panel.hidden = panel.id !== panelId;
    }

    elements.tabButtons.forEach((button, index) => {
      button.addEventListener("click", () => selectTab(button.dataset.tab));
      button.addEventListener("keydown", event => {
        if (!["ArrowLeft", "ArrowRight"].includes(event.key)) return;
        event.preventDefault();
        const direction = event.key === "ArrowRight" ? 1 : -1;
        const nextIndex = (index + direction + elements.tabButtons.length) % elements.tabButtons.length;
        elements.tabButtons[nextIndex].focus();
        selectTab(elements.tabButtons[nextIndex].dataset.tab);
      });
    });

    // 將台北日期與輸入的時分組成時間戳，避免跟著電腦的其他時區走。
    function taipeiNowParts() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Taipei",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23"
      }).formatToParts(new Date());
      return Object.fromEntries(parts.map(({ type, value }) => [type, value]));
    }

    function taipeiTimestamp(dayOffset, timeValue, parts = taipeiNowParts()) {
      const [hour, minute] = timeValue.split(":").map(Number);
      const utcDate = new Date(Date.UTC(
        Number(parts.year), Number(parts.month) - 1, Number(parts.day) + dayOffset,
        hour - 8, minute, 0
      ));
      return utcDate.getTime();
    }

    // 產生每筆任務識別碼，讓清單可以安全地單筆刪除。
    function createTaskId() {
      return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }

    // 僅保留格式完整的任務，並為舊版單筆資料補上識別碼。
    function normalizeTask(task) {
      if (!task || typeof task.title !== "string" || !task.title.trim()) return null;
      if (typeof task.start !== "string" || !/^\d{2}:\d{2}$/.test(task.start)) return null;
      if (typeof task.end !== "string" || !/^\d{2}:\d{2}$/.test(task.end) || task.start === task.end) return null;
      return {
        id: typeof task.id === "string" ? task.id : createTaskId(),
        title: task.title.trim(),
        start: task.start,
        end: task.end,
        notes: typeof task.notes === "string" ? task.notes.trim() : ""
      };
    }

    // 將全部任務一併存入 localStorage。
    function saveTasks() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(tasks));
        elements.saveStatus.textContent = "已儲存至這台裝置";
      } catch {
        elements.saveStatus.textContent = "目前無法使用本機儲存";
      }
      renderTask();
    }

    // 載入任務清單，也將舊版單筆資料升級成清單格式。
    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
        const savedTasks = Array.isArray(saved) ? saved : [saved];
        tasks = savedTasks.map(normalizeTask).filter(Boolean);
        if (!Array.isArray(saved)) localStorage.setItem(storageKey, JSON.stringify(tasks));
      } catch {
        tasks = [];
        elements.saveStatus.textContent = "尚無已儲存的任務";
      }
      renderTask();
    }

    // 計算每筆任務今日或跨午夜的開始、結束時間與進行狀態。
    function getTaskSchedule(task, now, parts) {
      const startMinutes = Number(task.start.slice(0, 2)) * 60 + Number(task.start.slice(3, 5));
      const endMinutes = Number(task.end.slice(0, 2)) * 60 + Number(task.end.slice(3, 5));
      const currentMinutes = Number(parts.hour) * 60 + Number(parts.minute);
      const overnight = endMinutes < startMinutes;
      const active = overnight
        ? currentMinutes >= startMinutes || currentMinutes < endMinutes
        : currentMinutes >= startMinutes && currentMinutes < endMinutes;
      let startDayOffset;
      let endDayOffset;

      if (active && overnight && currentMinutes < endMinutes) {
        startDayOffset = -1;
        endDayOffset = 0;
      } else if (active && overnight) {
        startDayOffset = 0;
        endDayOffset = 1;
      } else if (active) {
        startDayOffset = 0;
        endDayOffset = 0;
      } else {
        startDayOffset = currentMinutes < startMinutes ? 0 : 1;
        endDayOffset = startDayOffset + (overnight ? 1 : 0);
      }

      return {
        task,
        active,
        startTimestamp: taipeiTimestamp(startDayOffset, task.start, parts),
        endTimestamp: taipeiTimestamp(endDayOffset, task.end, parts),
        now
      };
    }

    // 以正在進行的任務優先；空檔則選擇下一筆開始時間最近的任務。
    function selectTask(schedules, now) {
      const activeSchedules = schedules.filter(schedule => schedule.active);
      if (activeSchedules.length) {
        return activeSchedules.sort((left, right) => left.endTimestamp - right.endTimestamp)[0];
      }
      return schedules
        .filter(schedule => schedule.startTimestamp > now)
        .sort((left, right) => left.startTimestamp - right.startTimestamp)[0] || null;
    }

    // 以安全的 DOM 文字節點呈現任務，並提供逐筆刪除。
    function renderTaskList(schedules, selected) {
      elements.taskList.replaceChildren();
      if (!schedules.length) {
        const emptyItem = document.createElement("li");
        emptyItem.className = "empty-list";
        emptyItem.textContent = "尚未新增任務";
        elements.taskList.append(emptyItem);
        return;
      }

      for (const schedule of schedules) {
        const item = document.createElement("li");
        item.className = "task-row";
        const copy = document.createElement("div");
        const title = document.createElement("div");
        title.className = "task-row-title";
        title.textContent = schedule.task.title;
        const meta = document.createElement("div");
        meta.className = "task-row-meta";
        meta.textContent = `${schedule.task.start} – ${schedule.task.end}${schedule.task.notes ? ` · ${schedule.task.notes}` : ""}`;
        copy.append(title, meta);

        const status = document.createElement("span");
        status.className = "task-row-status";
        status.textContent = schedule.active ? "進行中" : schedule === selected ? "下一個" : "已排定";

        const remove = document.createElement("button");
        remove.className = "delete-button";
        remove.type = "button";
        remove.dataset.removeId = schedule.task.id;
        remove.setAttribute("aria-label", `刪除 ${schedule.task.title}`);
        remove.textContent = "刪除";
        item.append(copy, status, remove);
        elements.taskList.append(item);
      }
    }

    // 顯示目前或下一項任務，並在最後 60 秒以紅色顯示倒數。
    function renderTask() {
      const now = Date.now();
      const parts = taipeiNowParts();
      const schedules = tasks.map(task => getTaskSchedule(task, now, parts));
      const selected = selectTask(schedules, now);
      const taskListState = `${selected?.task.id || ""}:${schedules.map(({ task, active }) => `${task.id}-${active}`).join("|")}`;
      elements.countdown.classList.remove("is-urgent", "is-ended");

      if (!selected) {
        elements.taskStatus.textContent = "目前任務";
        elements.taskTitle.textContent = "尚未設定任務";
        elements.taskTime.textContent = "請在下方新增任務";
        elements.notesLine.textContent = "";
        elements.notesLine.hidden = true;
        elements.countdownLabel.textContent = "距離結束還有";
        elements.countdownValue.textContent = "-- 分鐘";
      } else {
        const { task } = selected;
        const secondsLeft = Math.max(0, Math.floor((selected.endTimestamp - now) / 1000));
        elements.taskStatus.textContent = selected.active ? "目前任務" : "下一個任務";
        elements.taskTitle.textContent = task.title;
        elements.taskTime.textContent = `${task.start} – ${task.end}`;
        elements.notesLine.textContent = task.notes ? `備註：${task.notes}` : "";
        elements.notesLine.hidden = !task.notes;
        elements.countdownLabel.textContent = "距離結束還有";
        elements.countdownValue.textContent = `${Math.ceil(secondsLeft / 60)} 分鐘`;
        if (secondsLeft <= 60) elements.countdown.classList.add("is-urgent");
      }
      if (taskListState !== renderedTaskListState) {
        renderTaskList(schedules, selected);
        renderedTaskListState = taskListState;
      }
    }

    // 依文字長度決定靜態置中或連續滾動，並同步投影用文字。
    function renderNotice(message) {
      elements.noticeText.textContent = message || "尚未設定注意事項";
      elements.noticeTextDuplicate.textContent = message || "尚未設定注意事項";
      requestAnimationFrame(() => {
        const originalWhiteSpace = elements.noticeText.style.whiteSpace;
        elements.noticeText.style.whiteSpace = "nowrap";
        const textWidth = elements.noticeText.scrollWidth;
        elements.noticeText.style.whiteSpace = originalWhiteSpace;
        const windowWidth = elements.noticeWindow.clientWidth;
        const shouldScroll = textWidth > windowWidth - 24;
        elements.noticeTrack.classList.toggle("is-static", !shouldScroll);
        const distance = textWidth + 64;
        elements.noticeTrack.style.setProperty("--notice-duration", `${Math.max(12, distance / 45)}s`);
      });
    }

    // 還原注意事項；輸入變更時即時更新跑馬燈並保存。
    function loadNotice() {
      let message = defaultNotice;
      try {
        const saved = localStorage.getItem(noticeStorageKey);
        if (saved !== null) message = saved;
      } catch {
        elements.saveStatus.textContent = "目前無法讀取注意事項";
      }
      elements.noticeInput.value = message;
      renderNotice(message);
    }

    elements.noticeInput.addEventListener("input", () => {
      const message = elements.noticeInput.value.trim();
      renderNotice(message);
      try {
        localStorage.setItem(noticeStorageKey, message);
      } catch {
        elements.saveStatus.textContent = "目前無法儲存注意事項";
      }
    });

    // 驗證並保存課表設定，包含自動打鐘開關。
    function saveSchoolSchedule() {
      try {
        localStorage.setItem(scheduleStorageKey, JSON.stringify({ entries: scheduleEntries, enabled: autoBellEnabled }));
      } catch {
        elements.saveStatus.textContent = "目前無法儲存課表設定";
      }
    }

    // 載入課表和自動鐘狀態，忽略無效的舊資料。
    function loadSchoolSchedule() {
      try {
        const saved = JSON.parse(localStorage.getItem(scheduleStorageKey) || "{}");
        scheduleEntries = Array.isArray(saved.entries)
          ? saved.entries.filter(entry => periodOrder.includes(entry.period) && /^\d{2}:\d{2}$/.test(entry.start) && /^\d{2}:\d{2}$/.test(entry.end) && entry.start !== entry.end)
          : [];
        autoBellEnabled = saved.enabled === true;
      } catch {
        scheduleEntries = [];
        autoBellEnabled = false;
      }
      elements.autoBellToggle.checked = autoBellEnabled;
      renderScheduleList();
    }

    // 將課表依照節次排列，並停用已經加入的節次選項。
    function renderScheduleList() {
      elements.scheduleList.replaceChildren();
      for (const option of elements.periodInput.options) {
        option.disabled = scheduleEntries.some(entry => entry.period === option.value);
      }
      const sortedEntries = [...scheduleEntries].sort((left, right) => periodOrder.indexOf(left.period) - periodOrder.indexOf(right.period));
      if (!sortedEntries.length) {
        const emptyItem = document.createElement("li");
        emptyItem.className = "empty-list";
        emptyItem.textContent = "尚未新增課表";
        elements.scheduleList.append(emptyItem);
        return;
      }
      for (const entry of sortedEntries) {
        const row = document.createElement("li");
        row.className = "schedule-row";
        const period = document.createElement("span");
        period.className = "schedule-period";
        period.textContent = entry.period;
        const start = document.createElement("span");
        start.className = "schedule-times";
        start.textContent = `上課 ${entry.start}`;
        const end = document.createElement("span");
        end.className = "schedule-times end-time";
        end.textContent = `下課 ${entry.end}`;
        const remove = document.createElement("button");
        remove.className = "delete-button";
        remove.type = "button";
        remove.dataset.removePeriod = entry.period;
        remove.textContent = "刪除";
        remove.setAttribute("aria-label", `刪除${entry.period}課表`);
        row.append(period, start, end, remove);
        elements.scheduleList.append(row);
      }
    }

    // 解析逗號或定位字元分隔的文字，支援雙引號欄位與欄內逗號。
    function parseScheduleCsv(text) {
      const source = text.replace(/^\uFEFF/, "");
      const delimiter = source.split(/\r?\n/, 1)[0].includes("\t") ? "\t" : ",";
      const rows = [];
      let row = [];
      let field = "";
      let quoted = false;

      for (let index = 0; index < source.length; index += 1) {
        const character = source[index];
        if (character === '"') {
          if (quoted && source[index + 1] === '"') {
            field += '"';
            index += 1;
          } else {
            quoted = !quoted;
          }
        } else if (!quoted && character === delimiter) {
          row.push(field.trim());
          field = "";
        } else if (!quoted && (character === "\n" || character === "\r")) {
          if (character === "\r" && source[index + 1] === "\n") index += 1;
          row.push(field.trim());
          if (row.some(Boolean)) rows.push(row);
          row = [];
          field = "";
        } else {
          field += character;
        }
      }

      row.push(field.trim());
      if (row.some(Boolean)) rows.push(row);
      return rows;
    }

    // 查找 XLSX ZIP 中央目錄項目，取得工作表 XML 所需的壓縮區段。
    function findZipEntry(buffer, targetPath) {
      const view = new DataView(buffer);
      const decoder = new TextDecoder();
      const minimumOffset = Math.max(0, view.byteLength - 65557);
      let endOffset = -1;
      for (let offset = view.byteLength - 22; offset >= minimumOffset; offset -= 1) {
        if (view.getUint32(offset, true) === 0x06054b50) {
          endOffset = offset;
          break;
        }
      }
      if (endOffset < 0) throw new Error("找不到 Excel 檔案的工作簿資料。");

      const entryCount = view.getUint16(endOffset + 10, true);
      let offset = view.getUint32(endOffset + 16, true);
      for (let index = 0; index < entryCount; index += 1) {
        if (view.getUint32(offset, true) !== 0x02014b50) throw new Error("Excel 壓縮檔格式無效。");
        const flags = view.getUint16(offset + 8, true);
        const compression = view.getUint16(offset + 10, true);
        const compressedSize = view.getUint32(offset + 20, true);
        const nameLength = view.getUint16(offset + 28, true);
        const extraLength = view.getUint16(offset + 30, true);
        const commentLength = view.getUint16(offset + 32, true);
        const localOffset = view.getUint32(offset + 42, true);
        const name = decoder.decode(new Uint8Array(buffer, offset + 46, nameLength));
        if (name === targetPath) return { flags, compression, compressedSize, localOffset };
        offset += 46 + nameLength + extraLength + commentLength;
      }
      return null;
    }

    // 讀取 XLSX 壓縮項目，支援 ZIP 常見的儲存與 DEFLATE 壓縮方式。
    async function readXlsxEntry(buffer, path) {
      const entry = findZipEntry(buffer, path);
      if (!entry) return null;
      if (entry.flags & 1) throw new Error("不支援有密碼保護的 Excel 檔案。");
      const view = new DataView(buffer);
      const localOffset = entry.localOffset;
      const dataOffset = localOffset + 30 + view.getUint16(localOffset + 26, true) + view.getUint16(localOffset + 28, true);
      const compressedData = new Uint8Array(buffer, dataOffset, entry.compressedSize);
      if (entry.compression === 0) return new TextDecoder().decode(compressedData);
      if (entry.compression !== 8 || typeof DecompressionStream === "undefined") {
        throw new Error("此瀏覽器無法解壓這個 Excel 檔案。");
      }
      const stream = new Blob([compressedData]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return new Response(stream).text();
    }

    // 將工作簿關聯目標轉為 ZIP 根目錄中的標準路徑。
    function resolveXlsxPath(target) {
      const segments = target.startsWith("/") ? [] : ["xl"];
      for (const segment of target.split("/")) {
        if (!segment || segment === ".") continue;
        if (segment === "..") segments.pop();
        else segments.push(segment);
      }
      return segments.join("/");
    }

    // 解析 XLSX 第一個工作表，支援共享字串、內嵌字串和 Excel 時間儲存值。
    async function parseScheduleXlsx(buffer) {
      const workbookText = await readXlsxEntry(buffer, "xl/workbook.xml");
      const relationshipsText = await readXlsxEntry(buffer, "xl/_rels/workbook.xml.rels");
      if (!workbookText || !relationshipsText) throw new Error("找不到 Excel 工作簿或工作表資訊。");
      const workbook = new DOMParser().parseFromString(workbookText, "application/xml");
      const relationships = new DOMParser().parseFromString(relationshipsText, "application/xml");
      const sheet = workbook.getElementsByTagNameNS("*", "sheet")[0];
      const relationshipId = sheet?.getAttribute("r:id") || sheet?.getAttribute("id");
      const relationship = [...relationships.getElementsByTagNameNS("*", "Relationship")]
        .find(item => item.getAttribute("Id") === relationshipId);
      if (!relationship) throw new Error("Excel 檔案沒有可讀取的工作表。");

      const worksheetPath = resolveXlsxPath(relationship.getAttribute("Target"));
      const worksheetText = await readXlsxEntry(buffer, worksheetPath);
      if (!worksheetText) throw new Error("找不到 Excel 第一個工作表。");
      const worksheet = new DOMParser().parseFromString(worksheetText, "application/xml");
      const sharedText = await readXlsxEntry(buffer, "xl/sharedStrings.xml");
      const sharedStrings = sharedText
        ? [...new DOMParser().parseFromString(sharedText, "application/xml").getElementsByTagNameNS("*", "si")]
          .map(item => [...item.getElementsByTagNameNS("*", "t")].map(text => text.textContent).join(""))
        : [];

      return [...worksheet.getElementsByTagNameNS("*", "row")].map(row => {
        const values = [];
        for (const cell of row.getElementsByTagNameNS("*", "c")) {
          const reference = cell.getAttribute("r").match(/[A-Z]+/i)?.[0] || "A";
          const column = [...reference.toUpperCase()].reduce((total, letter) => total * 26 + letter.charCodeAt(0) - 64, 0) - 1;
          const type = cell.getAttribute("t");
          let value = cell.getElementsByTagNameNS("*", "v")[0]?.textContent || "";
          if (type === "s") value = sharedStrings[Number(value)] || "";
          if (type === "inlineStr") value = [...cell.getElementsByTagNameNS("*", "t")].map(text => text.textContent).join("");
          values[column] = value;
        }
        return values;
      });
    }

    // 標準化節次名稱，容許 Excel 常見的阿拉伯數字節次寫法。
    function normalizeImportedPeriod(value) {
      const period = String(value || "").trim().replace(/\s+/g, "");
      if (periodOrder.includes(period)) return period;
      const aliases = { "第1節": "第一節", "第2節": "第二節", "第3節": "第三節", "第4節": "第四節", "第5節": "第五節", "第6節": "第六節", "第7節": "第七節" };
      return aliases[period] || null;
    }

    // 將 CSV 時分、緊湊時分及 Excel 的一天小數轉成 HH:MM。
    function normalizeImportedTime(value) {
      const time = String(value ?? "").trim();
      const clockMatch = time.match(/^(\d{1,2}):(\d{2})(?::\d{2}(?:\.\d+)?)?$/);
      if (clockMatch) {
        const hour = Number(clockMatch[1]);
        const minute = Number(clockMatch[2]);
        if (hour > 23 || minute > 59) return null;
        return `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
      }
      if (/^\d{3,4}$/.test(time)) {
        const hour = Number(time.slice(0, -2));
        const minute = Number(time.slice(-2));
        if (hour <= 23 && minute <= 59) return `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
      }
      if (/^\d+(\.\d+)?$/.test(time)) {
        const serial = Number(time);
        if (serial >= 0 && serial < 1) {
          const totalMinutes = Math.round(serial * 1440) % 1440;
          return `${String(Math.floor(totalMinutes / 60)).padStart(2, "0")}:${String(totalMinutes % 60).padStart(2, "0")}`;
        }
      }
      return null;
    }

    // 驗證列資料並統計無效列；表頭及空白列不算錯誤。
    function validateImportedScheduleRows(rows) {
      const entries = new Map();
      let skipped = 0;
      for (const row of rows) {
        const values = Array.from(row, value => String(value ?? "").trim());
        if (!values.some(Boolean)) continue;
        if (["節次", "節別"].includes(values[0]) || /上課/.test(values[1] || "")) continue;
        const period = normalizeImportedPeriod(values[0]);
        const start = normalizeImportedTime(values[1]);
        const end = normalizeImportedTime(values[2]);
        if (!period || !start || !end || end <= start) {
          skipped += 1;
          continue;
        }
        entries.set(period, { period, start, end });
      }
      return { entries: [...entries.values()], skipped };
    }

    // 依副檔名解析 CSV 或 XLSX，將同名節次更新並保留其他既有課表。
    async function importScheduleFile(file) {
      const filename = file.name.toLowerCase();
      let rows;
      if (filename.endsWith(".csv")) {
        rows = parseScheduleCsv(await file.text());
      } else if (filename.endsWith(".xlsx")) {
        rows = await parseScheduleXlsx(await file.arrayBuffer());
      } else {
        throw new Error("請選擇 CSV 或 Excel .xlsx 檔案。");
      }

      const { entries, skipped } = validateImportedScheduleRows(rows);
      if (!entries.length) throw new Error("沒有找到有效課表，請確認每列格式為：第一節,08:10,09:00");
      const mergedEntries = new Map(scheduleEntries.map(entry => [entry.period, entry]));
      for (const entry of entries) mergedEntries.set(entry.period, entry);
      scheduleEntries = [...mergedEntries.values()];
      saveSchoolSchedule();
      renderScheduleList();
      elements.scheduleImportStatus.textContent = `匯入 ${entries.length} 節，略過 ${skipped} 列無效資料。`;
    }

    // 由按鈕開啟檔案選擇器，匯入失敗時在課表旁顯示可理解的訊息。
    elements.importScheduleButton.addEventListener("click", () => elements.scheduleFileInput.click());
    elements.scheduleFileInput.addEventListener("change", async () => {
      const [file] = elements.scheduleFileInput.files;
      if (!file) return;
      elements.scheduleImportStatus.textContent = "正在讀取課表…";
      try {
        await importScheduleFile(file);
      } catch (error) {
        elements.scheduleImportStatus.textContent = error instanceof Error ? error.message : "無法讀取這個檔案。";
      } finally {
        elements.scheduleFileInput.value = "";
      }
    });

    // 比較前一秒與目前台灣時間，只有在啟用時自動播放到點鈴聲。
    function checkScheduleAlerts(now) {
      const previous = previousScheduleCheck;
      previousScheduleCheck = now;
      if (!autoBellEnabled) return;
      const parts = taipeiNowParts();
      const alerts = [];
      for (const entry of scheduleEntries) {
        for (const dayOffset of [-1, 0]) {
          const startAt = taipeiTimestamp(dayOffset, entry.start, parts);
          const endAt = taipeiTimestamp(dayOffset, entry.end, parts);
          if (startAt > previous && startAt <= now) alerts.push("class");
          if (endAt > previous && endAt <= now) alerts.push("dismissal");
        }
      }
      alerts.forEach((kind, index) => window.setTimeout(() => playSchoolBell(kind), index * 1400));
    }

    // 將番茄鐘設定存入本機，供下次開啟時沿用。
    function savePomodoroSettings() {
      try {
        localStorage.setItem(pomodoroStorageKey, JSON.stringify(pomodoroSettings));
      } catch {
        elements.saveStatus.textContent = "目前無法儲存番茄鐘設定";
      }
    }

    // 還原有效的專注與休息分鐘數，否則採用 15/5 分鐘預設值。
    function loadPomodoroSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(pomodoroStorageKey) || "{}");
        const focusMinutes = Number(saved.focusMinutes);
        const breakMinutes = Number(saved.breakMinutes);
        if (Number.isInteger(focusMinutes) && focusMinutes >= 1 && focusMinutes <= 180) pomodoroSettings.focusMinutes = focusMinutes;
        if (Number.isInteger(breakMinutes) && breakMinutes >= 1 && breakMinutes <= 60) pomodoroSettings.breakMinutes = breakMinutes;
      } catch {
        // 無效資料時維持預設值。
      }
      elements.focusMinutesInput.value = String(pomodoroSettings.focusMinutes);
      elements.breakMinutesInput.value = String(pomodoroSettings.breakMinutes);
      pomodoroRemainingSeconds = pomodoroSettings.focusMinutes * 60;
      renderPomodoro();
    }

    // 還原本機累計專注秒數，並避免無效資料進入計時狀態。
    function loadFocusTotal() {
      try {
        const saved = Number(localStorage.getItem(focusTotalStorageKey));
        if (Number.isFinite(saved) && saved >= 0) focusTotalSeconds = Math.floor(saved);
      } catch {
        focusTotalSeconds = 0;
      }
      savedFocusTotalMinutes = Math.floor(focusTotalSeconds / 60);
      renderFocusTotal();
    }

    // 將累計時數格式化成易讀的分鐘或小時/分鐘。
    function renderFocusTotal() {
      const totalMinutes = Math.floor(focusTotalSeconds / 60);
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      const totalText = hours ? `${hours} 小時 ${minutes} 分鐘` : `${minutes} 分鐘`;
      elements.pomodoroFocusTotal.textContent = `專注累計 ${totalText}`;
    }

    // 每分鐘或階段結算時保存統計，並即時更新畫面。
    function saveFocusTotal(force = false) {
      const totalMinutes = Math.floor(focusTotalSeconds / 60);
      if (force || totalMinutes !== savedFocusTotalMinutes) {
        try {
          localStorage.setItem(focusTotalStorageKey, String(Math.floor(focusTotalSeconds)));
          savedFocusTotalMinutes = totalMinutes;
        } catch {
          elements.saveStatus.textContent = "目前無法儲存專注統計";
        }
      }
      renderFocusTotal();
    }

    // 僅計入實際運行中的專注時間，且不超過本輪截止時間。
    function recordFocusTime(now) {
      if (!pomodoroRunning || pomodoroMode !== "focus" || !pomodoroLastTickAt) return;
      const endAt = Math.min(now, pomodoroEndAt);
      const elapsedSeconds = Math.max(0, Math.floor((endAt - pomodoroLastTickAt) / 1000));
      if (elapsedSeconds > 0) {
        focusTotalSeconds += elapsedSeconds;
        pomodoroLastTickAt += elapsedSeconds * 1000;
        saveFocusTotal();
      }
      if (now >= pomodoroEndAt) pomodoroLastTickAt = now;
    }

    // 更新番茄鐘面板的階段、倒數、輪數和操作狀態。
    function renderPomodoro() {
      const minutes = Math.floor(pomodoroRemainingSeconds / 60);
      const seconds = pomodoroRemainingSeconds % 60;
      elements.pomodoroMode.textContent = pomodoroMode === "focus" ? "專注時間" : "休息時間";
      elements.pomodoroClock.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      elements.pomodoroRound.textContent = `第 ${pomodoroRound} 輪`;
      const phaseDuration = (pomodoroMode === "focus" ? pomodoroSettings.focusMinutes : pomodoroSettings.breakMinutes) * 60;
      const progress = Math.max(0, Math.min(100, pomodoroRemainingSeconds / phaseDuration * 100));
      elements.pomodoroProgress.style.setProperty("--progress", `${progress}%`);
      elements.pomodoroProgress.setAttribute("aria-valuenow", String(Math.round(progress)));
      elements.pomodoroProgress.setAttribute("aria-valuetext", `${Math.ceil(pomodoroRemainingSeconds / 60)} 分鐘剩餘`);
      elements.pomodoroProgress.dataset.mode = pomodoroMode;
      renderFocusTotal();
      syncBreakMusic();
      elements.pomodoroStartButton.disabled = pomodoroRunning;
      elements.pomodoroPauseButton.disabled = !pomodoroRunning;
    }

    function syncBreakMusic() {
      if (pomodoroRunning && pomodoroMode === "break") {
        if (breakMusic.paused && !breakMusicPlaybackBlocked) {
          breakMusic.play().catch(() => {
            breakMusicPlaybackBlocked = true;
          });
        }
        return;
      }

      breakMusic.pause();
      if (pomodoroMode !== "break") {
        breakMusic.currentTime = 0;
        breakMusicPlaybackBlocked = false;
      }
    }

    // 每秒依截止時間更新番茄鐘；階段結束時響鈴並自動切換。
    function updatePomodoro(now) {
      if (pomodoroRunning) {
        recordFocusTime(now);
        pomodoroRemainingSeconds = Math.max(0, Math.ceil((pomodoroEndAt - now) / 1000));
        if (now >= pomodoroEndAt) {
          playEndSound();
          switchPomodoroPhase(now, true);
          return;
        }
      }
      renderPomodoro();
    }

    // 切換專注/休息階段，完成一輪休息後才增加輪數。
    function switchPomodoroPhase(now, keepRunning) {
      recordFocusTime(now);
      if (pomodoroMode === "focus") {
        pomodoroMode = "break";
      } else {
        pomodoroMode = "focus";
        pomodoroRound += 1;
      }
      const durationMinutes = pomodoroMode === "focus" ? pomodoroSettings.focusMinutes : pomodoroSettings.breakMinutes;
      pomodoroRemainingSeconds = durationMinutes * 60;
      pomodoroRunning = keepRunning;
      pomodoroEndAt = keepRunning ? now + pomodoroRemainingSeconds * 1000 : 0;
      pomodoroLastTickAt = keepRunning ? now : 0;
      renderPomodoro();
    }

    // 番茄鐘時間設定變更後更新本階段長度並保存新設定。
    function applyPomodoroSettings() {
      recordFocusTime(Date.now());
      const focusMinutes = Number(elements.focusMinutesInput.value);
      const breakMinutes = Number(elements.breakMinutesInput.value);
      if (!Number.isInteger(focusMinutes) || focusMinutes < 1 || focusMinutes > 180 || !Number.isInteger(breakMinutes) || breakMinutes < 1 || breakMinutes > 60) {
        elements.focusMinutesInput.value = String(pomodoroSettings.focusMinutes);
        elements.breakMinutesInput.value = String(pomodoroSettings.breakMinutes);
        return;
      }
      pomodoroSettings = { focusMinutes, breakMinutes };
      pomodoroRemainingSeconds = (pomodoroMode === "focus" ? focusMinutes : breakMinutes) * 60;
      if (pomodoroRunning) {
        pomodoroEndAt = Date.now() + pomodoroRemainingSeconds * 1000;
        pomodoroLastTickAt = Date.now();
      }
      savePomodoroSettings();
      renderPomodoro();
    }

    function playAudioFile(audio) {
      const playback = audio.cloneNode();
      playback.currentTime = 0;
      playback.volume = Number(elements.soundVolumeInput.value) / 100;
      activeAudioPlaybacks.add(playback);
      playback.addEventListener("ended", () => activeAudioPlaybacks.delete(playback), { once: true });
      void playback.play().catch(() => activeAudioPlaybacks.delete(playback));
      return playback;
    }

    function updateSoundVolume() {
      const volume = Number(elements.soundVolumeInput.value) / 100;
      elements.soundVolumeValue.value = `${Math.round(volume * 100)}%`;
      for (const audio of [timerSound, classBellSound, dismissalBellSound, breakMusic, ...activeAudioPlaybacks]) {
        audio.volume = volume;
      }
      try {
        localStorage.setItem(soundVolumeStorageKey, String(Math.round(volume * 100)));
      } catch {
        elements.saveStatus.textContent = "目前無法儲存音量設定";
      }
    }

    function loadSoundVolume() {
      try {
        const savedVolume = localStorage.getItem(soundVolumeStorageKey);
        if (savedVolume !== null) {
          const volume = Number(savedVolume);
          if (Number.isFinite(volume)) {
            elements.soundVolumeInput.value = String(Math.max(0, Math.min(100, volume)));
          }
        }
      } catch {
        elements.soundVolumeInput.value = "70";
      }
      updateSoundVolume();
    }

    function playEndSound() {
      const playback = playAudioFile(timerSound);
      window.setTimeout(() => {
        playback.pause();
        playback.currentTime = 0;
        activeAudioPlaybacks.delete(playback);
      }, 3000);
    }

    function playSchoolBell(kind) {
      playAudioFile(kind === "class" ? classBellSound : dismissalBellSound);
    }

    // 每秒檢查結束時間是否剛好跨過，避免同一任務重複鳴響。
    function checkTaskEndAlerts(now) {
      const previous = previousClockUpdate;
      const parts = taipeiNowParts();
      const hasEnded = tasks.some(task => [-1, 0].some(dayOffset => {
        const endTimestamp = taipeiTimestamp(dayOffset, task.end, parts);
        return endTimestamp > previous && endTimestamp <= now;
      }));
      if (hasEnded) playEndSound();
      previousClockUpdate = now;
    }

    // 每秒刷新台灣時間、任務倒數與結束提示。
    function updateClock() {
      const now = Date.now();
      checkTaskEndAlerts(now);
      checkScheduleAlerts(now);
      const time = taipeiTimeFormatter.format(new Date());
      elements.clock.textContent = time;
      elements.dateLine.textContent = taipeiDateFormatter.format(new Date());
      renderTask();
      updatePomodoro(now);
    }

    elements.classBellButton.addEventListener("click", () => playSchoolBell("class"));
    elements.dismissalBellButton.addEventListener("click", () => playSchoolBell("dismissal"));

    // 新增一節課表；時間必須有效，且下課時間要晚於上課時間。
    elements.scheduleForm.addEventListener("submit", event => {
      event.preventDefault();
      const period = elements.periodInput.value;
      const start = elements.periodStartInput.value;
      const end = elements.periodEndInput.value;
      if (end <= start) {
        elements.periodEndInput.setCustomValidity("下課時間需晚於上課時間");
        elements.periodEndInput.reportValidity();
        return;
      }
      elements.periodEndInput.setCustomValidity("");
      if (scheduleEntries.some(entry => entry.period === period)) return;
      scheduleEntries.push({ period, start, end });
      elements.scheduleForm.reset();
      saveSchoolSchedule();
      renderScheduleList();
    });
    elements.periodEndInput.addEventListener("input", () => elements.periodEndInput.setCustomValidity(""));

    // 自動打鐘開關獨立保存。
    elements.autoBellToggle.addEventListener("change", () => {
      autoBellEnabled = elements.autoBellToggle.checked;
      previousScheduleCheck = Date.now();
      saveSchoolSchedule();
    });

    // 刪除單一節次並更新儲存內容與節次選單。
    elements.scheduleList.addEventListener("click", event => {
      const removeButton = event.target.closest("[data-remove-period]");
      if (!removeButton) return;
      scheduleEntries = scheduleEntries.filter(entry => entry.period !== removeButton.dataset.removePeriod);
      saveSchoolSchedule();
      renderScheduleList();
    });

    // 開始倒數；到期時播放對應的音效檔。
    elements.pomodoroStartButton.addEventListener("click", () => {
      if (pomodoroRunning) return;
      breakMusicPlaybackBlocked = false;
      pomodoroRunning = true;
      const now = Date.now();
      pomodoroEndAt = now + pomodoroRemainingSeconds * 1000;
      pomodoroLastTickAt = now;
      renderPomodoro();
    });

    // 暫停保留剩餘秒數，按開始可從暫停處繼續。
    elements.pomodoroPauseButton.addEventListener("click", () => {
      if (!pomodoroRunning) return;
      const now = Date.now();
      recordFocusTime(now);
      pomodoroRemainingSeconds = Math.max(0, Math.ceil((pomodoroEndAt - now) / 1000));
      pomodoroRunning = false;
      pomodoroEndAt = 0;
      pomodoroLastTickAt = 0;
      saveFocusTotal(true);
      renderPomodoro();
    });

    // 重設回第一輪的專注時間並停止倒數。
    elements.pomodoroResetButton.addEventListener("click", () => {
      recordFocusTime(Date.now());
      pomodoroRunning = false;
      pomodoroMode = "focus";
      pomodoroRound = 1;
      pomodoroRemainingSeconds = pomodoroSettings.focusMinutes * 60;
      pomodoroEndAt = 0;
      pomodoroLastTickAt = 0;
      saveFocusTotal(true);
      renderPomodoro();
    });

    // 跳過目前階段；若正在倒數，下一階段會立即接續開始。
    elements.pomodoroSkipButton.addEventListener("click", () => {
      switchPomodoroPhase(Date.now(), pomodoroRunning);
    });
    elements.focusMinutesInput.addEventListener("change", applyPomodoroSettings);
    elements.breakMinutesInput.addEventListener("change", applyPomodoroSettings);

    // 新增任務前拒絕無效或 24 小時制起訖相同的時段。
    elements.taskForm.addEventListener("submit", event => {
      event.preventDefault();
      if (elements.startInput.value === elements.endInput.value) {
        elements.endInput.setCustomValidity("結束時間需與開始時間不同");
        elements.endInput.reportValidity();
        return;
      }
      elements.endInput.setCustomValidity("");
      tasks.push(normalizeTask({
        id: createTaskId(),
        title: elements.taskInput.value,
        start: elements.startInput.value,
        end: elements.endInput.value,
        notes: elements.notesInput.value
      }));
      elements.taskForm.reset();
      previousClockUpdate = Date.now();
      saveTasks();
    });

    elements.endInput.addEventListener("input", () => elements.endInput.setCustomValidity(""));

    elements.soundVolumeInput.addEventListener("input", updateSoundVolume);
    elements.soundTestButton.addEventListener("click", playEndSound);

    // 刪除單筆任務後立即同步更新畫面與本機儲存。
    elements.taskList.addEventListener("click", event => {
      const removeButton = event.target.closest("[data-remove-id]");
      if (!removeButton) return;
      tasks = tasks.filter(task => task.id !== removeButton.dataset.removeId);
      saveTasks();
    });

    // 透過瀏覽器 Fullscreen API 切換，並以 body 狀態隱藏編輯欄位。
    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch {
        elements.saveStatus.textContent = "瀏覽器未允許全螢幕，請再試一次";
      }
    }

    // 同步處理按鈕標籤與投影樣式，包含使用鍵盤 Esc 離開全螢幕的情況。
    document.addEventListener("fullscreenchange", () => {
      const isFullscreen = Boolean(document.fullscreenElement);
      document.body.classList.toggle("projector", isFullscreen);
      elements.fullscreenButton.textContent = isFullscreen ? "離開全螢幕" : "進入全螢幕";
      elements.fullscreenButton.setAttribute("aria-pressed", String(isFullscreen));
    });

    // 維持全螢幕切換操作，並在啟動時還原任務清單。
    elements.fullscreenButton.addEventListener("click", toggleFullscreen);
    selectTab("taskClockView");
    loadNotice();
    loadSchoolSchedule();
    loadPomodoroSettings();
    loadFocusTotal();
    loadSoundVolume();
    loadTasks();
    updateClock();
    window.setInterval(updateClock, 1000);
  </script>
</body>
</html>
